spring.application.name=smart-appointment
spring.datasource.url=${MYSQL_URL}
spring.jpa.properties.hibernate.default_schema=${MYSQL_DATABASE}
spring.datasource.username=${MYSQL_USERNAME}
spring.datasource.password=${MYSQL_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

server.port=9090

jwt.secret.key=${JWT_SECRET_KEY}
jwt.access.token.expiration.millis=${JWT_ACCESS_TOKEN_EXPIRATION}
jwt.refresh.token.expiration.millis=${JWT_REFRESH_TOKEN_EXPIRATION}

spring.data.redis.host= ${REDIS_HOST}
spring.data.redis.port= ${REDIS_PORT}
spring.data.redis.password= ${REDIS_PASSWORD}
spring.data.redis.timeout= ${REDIS_TIMEOUT}

spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_TLS_ENABLE}

password.reset.url=${PASSWORD_RESET_URL}
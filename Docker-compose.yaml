services:
  db:
    image: mysql:latest
    restart: always
    container_name: mysql
    ports:
      - "3306:3306"
    environment:
      - MYSQL_USER=${MYSQL_USERNAME}
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_DATABASE=${MYSQL_DATABASE}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}" ]
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - ortakag

  smartappointment:
    image: ogulcanonder/smart-appointment:v1
    container_name: smart-appointment
    ports:
      - 8080:8080
    depends_on:
     db:
       condition: service_healthy
    networks:
      - ortakag
    environment:
      SPRING_DATASOURCE_URL: ${MYSQL_URL}
      SPRING_JPA_PROPERTIES_HIBERNATE_DEFAULT_SCHEMA: ${MYSQL_DATABASE}
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD}

networks:
  ortakag:
    driver: bridge

  